version: "3.8"
name: vitals

services:

  # PostgreSQL database for Patient Service
  patient-db:
    image: postgres:17
    container_name: patient-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: patientdb
    ports:
      - "5432:5432"
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    restart: unless-stopped


  # Example: PostgreSQL database for another service in the future
  # billing-db:
  #   image: postgres:17
  #   container_name: billing-db
  #   environment:
  #     POSTGRES_USER: billing_user
  #     POSTGRES_PASSWORD: billing_password
  #     POSTGRES_DB: billingdb
  #   ports:
  #     - "5433:5432"   # Host port changes, container port stays 5432
  #   volumes:
  #     - billing-db-data:/var/lib/postgresql/data


  # Kafka broker (KRaft mode - no Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped


  # Kafka Web UI
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "9080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped


volumes:

  # Persistent storage for patient database
  patient-db-data:

  # Persistent storage for Kafka
  kafka-data:

  # Persistent storage for billing database (future)
  # billing-db-data: